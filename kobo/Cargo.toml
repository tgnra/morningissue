[package]
name = "morningissue"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Morning Issue reader for Kobo e-readers"

[[bin]]
name = "morningissue"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sha2 = "0.10"
libc = "0.2"
# Server sync (docs/kobo-sync.md, "Transport"). All pure Rust but ring, whose C and assembly
# clang builds.
hkdf = "0.12"
miniz_oxide = "0.8"
qrcode = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rqrr = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Unwinding, so a panic on the sync thread ends that sync only, and a panic on the main
# thread still saves the session and restores the light before the reader exits.
panic = "unwind"
strip = true

# Font rasterising and image decoding are slow unoptimised; keep tests quick.
[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2

# The reader's own drawing loops too, so the screenshot tests run in seconds.
[profile.test]
opt-level = 1
