# Where the discovery catalogue's candidate feeds come from. Read by build_catalogue.py.
# Licences and attribution are recorded in SOURCES.md; keep the two in step. Only openly
# licensed lists belong here. ooh.directory, blogroll.org, Feedspot and Feedly are deliberately
# absent (no licence, or terms that forbid reuse); see SOURCES.md.

[kagi]
name = "Kagi Small Web"
licence = "MIT"
homepage = "https://github.com/kagisearch/smallweb"
format = "lines"
# Blogs only. smallyt.txt (YouTube) and smallcomic.txt (webcomics) are left out on purpose.
lists = ["https://raw.githubusercontent.com/kagisearch/smallweb/main/smallweb.txt"]

[plenary]
name = "plenaryapp/awesome-rss-feeds"
licence = "CC0-1.0"
homepage = "https://github.com/plenaryapp/awesome-rss-feeds"
format = "opml"
base = "https://raw.githubusercontent.com/plenaryapp/awesome-rss-feeds/master/"
# Each file's name is its category, which labels the clusters. Country files are news and get
# the category "News"; only countries with English-language outlets are listed, and the
# language filter still applies to every feed.
