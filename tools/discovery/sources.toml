[hn]
name = "outcoldman/hackernews-personal-blogs"
licence = "MIT"
homepage = "https://github.com/outcoldman/hackernews-personal-blogs"
format = "opml"
lists = ["https://raw.githubusercontent.com/outcoldman/hackernews-personal-blogs/master/list.opml"]

# Not a feed source: the Public Suffix List (MPL-2.0), read at build time to work out each
# feed's registrable host. Nothing from it ships in the app.
[public_suffix]
url = "https://publicsuffix.org/list/public_suffix_list.dat"
# Hosts where every subdomain or first path segment is a different author, in case the list
# lacks them. A feed on one of these is keyed by its own subdomain.
extra_suffixes = [
  "bearblog.dev", "github.io", "gitlab.io", "codeberg.page", "wordpress.com", "blogspot.com",
  "substack.com", "micro.blog", "neocities.org", "netlify.app", "pages.dev", "vercel.app",
  "tumblr.com", "svbtle.com", "prose.sh", "mataroa.blog", "ghost.io", "beehiiv.com",
  "buttondown.email", "posthaven.com", "typepad.com", "livejournal.com", "dreamwidth.org",
  "hashnode.dev", "srht.site", "omg.lol", "weblog.lol", "blogs.com",
]
# Hosts that serve many authors' feeds by path; deduplication keys these by the first path
# segment of the site address (medium.com/@alice) instead of by host.
path_tenants = ["medium.com", "dev.to", "write.as", "tilde.club", "tilde.team", "sdf.org"]
# Feed proxies: a feed served from one of these takes its host from its site address.
feed_proxies = [
  "feeds.feedburner.com", "feedproxy.google.com", "feeds2.feedburner.com", "feeds.feedblitz.com",
  "feedpress.me", "feed.informer.com", "rss.app", "fetchrss.com", "feeds.simplecast.com",
  "feeds.megaphone.fm", "anchor.fm", "rss.art19.com", "feeds.buzzsprout.com", "feeds.transistor.fm",
]
