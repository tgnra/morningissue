# Runs the unit tests, the 180-day ranking simulation among them, the Kobo reader's tests and the
# relay server's tests on every push and pull request.
# The simulation's per-persona reports (how affinity and W moved) and the test reports are kept
# as workflow artifacts, so a failing ranking check can be diagnosed from the run's page.
name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The same JDK as the release build; the app compiles for Java 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches the Gradle distribution, dependencies and build cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest -PsimulationReport

      - name: Upload the ranking simulation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ranking-simulation-reports
          path: app/build/reports/simulation/
          if-no-files-found: ignore

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # The Kobo reader's tests: sync against a fake relay, the phone's golden fixtures, and the
  # screenshot walks at every supported screen size.
  kobo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Run the Kobo tests
        working-directory: kobo
        run: cargo test --locked

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kobo-screens
          path: kobo/target/screens/
          if-no-files-found: ignore

  # The relay server's tests: the shared test vectors and the HTTP API, under the race detector.
  relay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.mod

      - name: Run the relay tests
        working-directory: relay
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...
