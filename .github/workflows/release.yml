# Pushing a tag that starts with "v" builds a signed APK and publishes it as a GitHub release,
# then builds the Kobo reader zip and attaches it to the same release. (The server's image is
# built by server-image.yml.)
# Running the workflow by hand (Actions > Release > Run workflow) builds the same signed APK
# and uploads it as a workflow artifact, without creating a release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew :core:test :server:test :app:testDebugUnitTest

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew assembleRelease \
            "-PappVersionName=$VERSION_NAME" \
            "-PappVersionCode=$VERSION_CODE"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the signature and name the APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK at $apk (was the release signing config applied?)"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          out="morning-issue-$VERSION_NAME.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: morning-issue-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish the GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Morning Issue $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  # The Kobo reader (kobo/): one static ARM binary, packaged as a zip to unzip at the root of
  # the KOBOeReader drive. It waits for the release job so the release exists to attach to.
  kobo:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the Kobo tests
        working-directory: kobo
        run: cargo test --locked

      - name: Build the Kobo zip
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          rustup target add armv7-unknown-linux-musleabihf
          kobo/build.sh
          zip="kobo/dist/morningissue-kobo-$VERSION.zip"
          test -f "$zip"
          unzip -l "$zip"

      - name: Upload the zip as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: morningissue-kobo-${{ steps.version.outputs.name }}
          path: kobo/dist/morningissue-kobo-${{ steps.version.outputs.name }}.zip
          if-no-files-found: error

      - name: Attach the zip to the GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "kobo/dist/morningissue-kobo-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY"
